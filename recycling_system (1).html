<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Acopio - Sistema de Reciclaje</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tab-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .tab-button {
            flex: 1;
            padding: 14px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 15px;
            color: #374151;
        }

        .tab-button:hover {
            background: #e5e7eb;
        }

        .tab-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .points-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            margin: 24px 0;
        }

        .points-display .label {
            font-size: 13px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .points-display .value {
            font-size: 48px;
            font-weight: bold;
        }

        .points-display .money-value {
            font-size: 24px;
            opacity: 0.95;
            margin-top: 8px;
            font-weight: 600;
        }

        .points-display .user-name {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 8px;
        }

        .money-card {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin: 16px 0;
        }

        .money-card .label {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 4px;
        }

        .money-card .value {
            font-size: 32px;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.redeem-button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            margin-top: 12px;
        }

        button.redeem-button:hover {
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.4);
        }

        button.redeem-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .success-message {
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #6ee7b7;
            display: none;
            animation: slideIn 0.3s;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .history {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #e5e7eb;
        }

        .history h3 {
            color: #374151;
            margin-bottom: 16px;
            font-size: 18px;
        }

        .transaction {
            background: #f9fafb;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e7eb;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-type {
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
            text-transform: capitalize;
        }

        .transaction-details {
            font-size: 13px;
            color: #6b7280;
        }

        .transaction-points {
            font-weight: bold;
            color: #667eea;
            font-size: 24px;
        }

        .transaction-points.redeem {
            color: #10b981;
        }

        .conversion-rate {
            background: #fef3c7;
            border: 2px solid #fbbf24;
            color: #92400e;
            padding: 12px;
            border-radius: 10px;
            margin: 16px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        .stats {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

        @media (max-width: 640px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .points-display .value {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 Punto de Acopio</h1>
        <p class="subtitle">Sistema de Registro de Residuos Reciclables</p>

        <div class="tab-buttons">
            <button class="tab-button active" onclick="showTab('register')">Registrar</button>
            <button class="tab-button" onclick="showTab('consult')">Consultar</button>
        </div>

        <!-- Tab de Registro -->
        <div id="register-tab" class="tab-content active">
            <div class="form-group">
                <label for="cedula">Número de Cédula</label>
                <input type="text" id="cedula" placeholder="Ej: 1234567890">
            </div>

            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Nombre del usuario">
            </div>

            <div class="form-group">
                <label for="tipoResiduo">Tipo de Residuo</label>
                <select id="tipoResiduo" onchange="calcularPuntos()">
                    <option value="">Seleccione...</option>
                    <option value="plastico">Plástico (10 pts/kg)</option>
                    <option value="papel">Papel/Cartón (5 pts/kg)</option>
                    <option value="vidrio">Vidrio (8 pts/kg)</option>
                    <option value="metal">Metal (15 pts/kg)</option>
                    <option value="electronico">Electrónico (20 pts/kg)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" step="0.1" min="0.1" placeholder="0.0" oninput="calcularPuntos()">
            </div>

            <div class="points-display">
                <div class="label">Puntos a Otorgar</div>
                <div class="value" id="puntosCalculados">0</div>
                <div class="money-value">💵 $<span id="dineroCalculado">0</span> COP</div>
            </div>

            <button onclick="registrarEntrega()">Registrar Entrega</button>

            <div class="success-message" id="successMessage"></div>
        </div>

        <!-- Tab de Consulta -->
        <div id="consult-tab" class="tab-content">
            <div class="form-group">
                <label for="cedulaConsulta">Número de Cédula</label>
                <input type="text" id="cedulaConsulta" placeholder="Ej: 1234567890">
            </div>
            <button onclick="consultarPuntos()">Consultar Puntos</button>

            <div id="consultaResult" style="display:none;">
                <div class="conversion-rate">
                    💰 1 Punto = $50 COP en Supermercado
                </div>

                <div class="points-display">
                    <div class="label">Puntos Totales</div>
                    <div class="value" id="puntosUsuario">0</div>
                    <div class="user-name" id="nombreUsuario"></div>
                </div>

                <div class="money-card">
                    <div class="label">Valor Disponible para Canje</div>
                    <div class="value">$<span id="dineroDisponible">0</span></div>
                    <div class="label" style="margin-top: 4px;">Pesos Colombianos</div>
                </div>

                <button class="redeem-button" id="btnCanjear" onclick="canjearPuntos()">
                    🛒 Canjear Puntos en Supermercado
                </button>

                <div class="history">
                    <h3>📋 Historial Reciente</h3>
                    <div id="historialTransacciones"></div>
                </div>
            </div>
        </div>

        <div class="stats">
            📊 Usuarios registrados: <span id="totalUsuarios">0</span> | 
            Transacciones: <span id="totalTransacciones">0</span>
        </div>
    </div>

    <script>
        // Sistema de almacenamiento en memoria
        let usuarios = {};
        let transacciones = [];

        // Tasa de conversión: 1 punto = 50 pesos colombianos
        const PESOS_POR_PUNTO = 50;

        // Cargar datos al iniciar
        window.onload = function() {
            actualizarEstadisticas();
        };

        // Tabla de conversión de puntos
        const puntosXKg = {
            'plastico': 10,
            'papel': 5,
            'vidrio': 8,
            'metal': 15,
            'electronico': 20
        };

        function calcularPuntos() {
            const peso = parseFloat(document.getElementById('peso').value) || 0;
            const tipo = document.getElementById('tipoResiduo').value;
            const puntos = tipo ? Math.round(peso * puntosXKg[tipo]) : 0;
            const dinero = puntos * PESOS_POR_PUNTO;
            
            document.getElementById('puntosCalculados').textContent = puntos;
            document.getElementById('dineroCalculado').textContent = dinero.toLocaleString('es-CO');
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            if (tab === 'register') {
                document.getElementById('register-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[0].classList.add('active');
            } else {
                document.getElementById('consult-tab').classList.add('active');
                document.querySelectorAll('.tab-button')[1].classList.add('active');
            }
        }

        function registrarEntrega() {
            const cedula = document.getElementById('cedula').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const tipoResiduo = document.getElementById('tipoResiduo').value;
            const peso = parseFloat(document.getElementById('peso').value);

            if (!cedula || !nombre || !tipoResiduo || !peso) {
                alert('Por favor complete todos los campos');
                return;
            }

            const puntos = Math.round(peso * puntosXKg[tipoResiduo]);

            // Crear o actualizar usuario
            if (!usuarios[cedula]) {
                usuarios[cedula] = {
                    nombre: nombre,
                    puntosTotales: 0,
                    transacciones: []
                };
            }

            usuarios[cedula].puntosTotales += puntos;

            const transaccion = {
                fecha: new Date().toLocaleString('es-CO'),
                tipo: tipoResiduo,
                peso: peso,
                puntos: puntos
            };

            usuarios[cedula].transacciones.unshift(transaccion);
            transacciones.unshift({ cedula, ...transaccion, nombre });

            // Mostrar mensaje de éxito
            const successMsg = document.getElementById('successMessage');
            const dineroEquivalente = puntos * PESOS_POR_PUNTO;
            successMsg.textContent = `✅ ¡Registro exitoso! ${puntos} puntos otorgados a ${nombre} (Equivalente a $${dineroEquivalente.toLocaleString('es-CO')} COP)`;
            successMsg.classList.add('show');

            setTimeout(() => {
                successMsg.classList.remove('show');
            }, 5000);

            // Limpiar formulario
            document.getElementById('cedula').value = '';
            document.getElementById('nombre').value = '';
            document.getElementById('tipoResiduo').value = '';
            document.getElementById('peso').value = '';
            document.getElementById('puntosCalculados').textContent = '0';
            document.getElementById('dineroCalculado').textContent = '0';

            actualizarEstadisticas();
        }

        function canjearPuntos() {
            const cedula = document.getElementById('cedulaConsulta').value.trim();
            const usuario = usuarios[cedula];

            if (!usuario || usuario.puntosTotales === 0) {
                alert('No hay puntos disponibles para canjear');
                return;
            }

            const puntosACanjear = usuario.puntosTotales;
            const dineroCanjeado = puntosACanjear * PESOS_POR_PUNTO;

            const confirmar = confirm(
                `¿Desea canjear ${puntosACanjear} puntos por $${dineroCanjeado.toLocaleString('es-CO')} COP?\n\n` +
                `Esto generará un cupón para usar en el supermercado.`
            );

            if (confirmar) {
                // Registrar el canje
                const transaccionCanje = {
                    fecha: new Date().toLocaleString('es-CO'),
                    tipo: 'canje',
                    peso: 0,
                    puntos: -puntosACanjear,
                    dinero: dineroCanjeado
                };

                usuario.transacciones.unshift(transaccionCanje);
                transacciones.unshift({ cedula, ...transaccionCanje, nombre: usuario.nombre });
                usuario.puntosTotales = 0;

                alert(
                    `✅ ¡Canje exitoso!\n\n` +
                    `Cupón generado: $${dineroCanjeado.toLocaleString('es-CO')} COP\n` +
                    `Código de canje: ${cedula}-${Date.now()}\n\n` +
                    `Presente este código en caja del supermercado.`
                );

                // Actualizar vista
                consultarPuntos();
                actualizarEstadisticas();
            }
        }

        function consultarPuntos() {
            const cedula = document.getElementById('cedulaConsulta').value.trim();
            
            if (!cedula) {
                alert('Por favor ingrese un número de cédula');
                return;
            }

            const usuario = usuarios[cedula];
            const resultado = document.getElementById('consultaResult');

            if (usuario) {
                const dineroDisponible = usuario.puntosTotales * PESOS_POR_PUNTO;
                
                document.getElementById('puntosUsuario').textContent = usuario.puntosTotales;
                document.getElementById('nombreUsuario').textContent = usuario.nombre;
                document.getElementById('dineroDisponible').textContent = dineroDisponible.toLocaleString('es-CO');
                
                // Habilitar/deshabilitar botón de canje
                const btnCanjear = document.getElementById('btnCanjear');
                if (usuario.puntosTotales > 0) {
                    btnCanjear.disabled = false;
                    btnCanjear.textContent = `🛒 Canjear ${usuario.puntosTotales} Puntos ($${dineroDisponible.toLocaleString('es-CO')} COP)`;
                } else {
                    btnCanjear.disabled = true;
                    btnCanjear.textContent = '🛒 No hay puntos para canjear';
                }
                
                const historial = document.getElementById('historialTransacciones');
                historial.innerHTML = '';

                if (usuario.transacciones.length > 0) {
                    usuario.transacciones.slice(0, 10).forEach(t => {
                        const div = document.createElement('div');
                        div.className = 'transaction';
                        
                        if (t.tipo === 'canje') {
                            div.innerHTML = `
                                <div class="transaction-info">
                                    <div class="transaction-type">💵 Canje en Supermercado</div>
                                    <div class="transaction-details">${t.fecha} - $${t.dinero.toLocaleString('es-CO')} COP</div>
                                </div>
                                <div class="transaction-points redeem">${t.puntos}</div>
                            `;
                        } else {
                            div.innerHTML = `
                                <div class="transaction-info">
                                    <div class="transaction-type">${t.tipo}</div>
                                    <div class="transaction-details">${t.fecha} - ${t.peso} kg</div>
                                </div>
                                <div class="transaction-points">+${t.puntos}</div>
                            `;
                        }
                        historial.appendChild(div);
                    });
                } else {
                    historial.innerHTML = '<div class="no-data">No hay transacciones registradas</div>';
                }

                resultado.style.display = 'block';
            } else {
                alert('No se encontraron registros para esta cédula');
                resultado.style.display = 'none';
            }
        }

        function actualizarEstadisticas() {
            document.getElementById('totalUsuarios').textContent = Object.keys(usuarios).length;
            document.getElementById('totalTransacciones').textContent = transacciones.length;
        }
    </script>
</body>
</html>
